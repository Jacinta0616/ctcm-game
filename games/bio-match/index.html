<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配對挑戰 | 環保小遊戲</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* ── 進度條 ── */
    .progress-wrap {
      margin-bottom: 1.2rem;
      text-align: center;
    }
    .progress-label {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 0.45rem;
    }
    .progress-track {
      background: var(--green-light);
      border-radius: 999px;
      height: 14px;
      overflow: hidden;
      max-width: 600px;
      margin: 0 auto;
    }
    .progress-fill {
      background: linear-gradient(90deg, #ffb74d, #e65100);
      height: 100%;
      border-radius: 999px;
      transition: width 0.45s ease;
    }

    /* ── 題目卡（情境）── */
    .question-card {
      background: white;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      border: 3px solid var(--green-light);
      padding: 1.8rem 1.6rem 1.5rem;
      text-align: center;
      max-width: 660px;
      margin: 0 auto 1.4rem;
    }
    .situation-emoji {
      font-size: 5rem;
      display: block;
      margin-bottom: 0.5rem;
      animation: iconWiggle 2.5s ease-in-out infinite;
    }
    .situation-title {
      font-size: clamp(1.3rem, 3.5vw, 1.7rem);
      font-weight: 900;
      color: var(--green-dark);
      margin-bottom: 0.5rem;
    }
    .situation-desc {
      font-size: clamp(0.95rem, 2.3vw, 1.1rem);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── 工具選項 ── */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      max-width: 700px;
      margin: 0 auto;
    }
    .tool-btn {
      background: white;
      border: 3px solid var(--green-light);
      border-radius: var(--radius-lg);
      padding: 1.2rem 0.8rem 1rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .tool-btn:hover:not(:disabled) {
      border-color: #ffb74d;
      background: #fff8f0;
      transform: translateY(-4px);
      box-shadow: var(--shadow-sm);
    }
    .tool-emoji { font-size: 3rem; line-height: 1; }
    .tool-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--green-dark);
    }
    .tool-desc {
      font-size: 0.85rem;
      color: var(--text-light);
      text-align: center;
      line-height: 1.45;
    }

    .tool-btn.correct {
      border-color: #43a047;
      background: #e8f5e9;
    }
    .tool-btn.wrong {
      border-color: #e53935;
      background: #ffebee;
    }

    /* ── 解說 ── */
    .explain-box {
      background: var(--yellow);
      border-left: 5px solid #fbc02d;
      border-radius: var(--radius-sm);
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      line-height: 1.65;
      max-width: 660px;
      margin: 1rem auto 0;
      display: none;
      animation: fadeInUp 0.35s ease;
    }
    .explain-box.visible { display: block; }
  </style>
</head>
<body>

  <div class="bg-deco" aria-hidden="true">
    <span class="leaf" style="top:8%;left:3%;font-size:1.6rem;animation-delay:0s">🌿</span>
    <span class="leaf" style="top:20%;right:4%;font-size:2rem;animation-delay:1.5s">🍃</span>
    <span class="leaf" style="bottom:15%;left:2%;font-size:1.3rem;animation-delay:3s">🌱</span>
    <span class="leaf" style="bottom:25%;right:5%;font-size:1.8rem;animation-delay:2s">🍀</span>
  </div>

  <div class="container">

    <header class="game-nav">
      <a href="../../themes/bio.html" class="btn-back">← 返回</a>
      <span class="game-title-bar">🎯 配對挑戰</span>
      <div class="score-board">✅ <span id="score">0</span> / <span id="total">6</span></div>
    </header>

    <div id="game-area"></div>

  </div>

  <script>
  // ────────────────────────────────
  //  三種防治工具（固定）與情境題庫
  //  情境題庫優先從後台 localStorage 讀取
  // ────────────────────────────────
  const tools = [
    {
      id: 'drain',
      emoji: '🟤',
      name: '溝渠劑',
      desc: '殺滅管道中的蛾蚋幼蟲（孑孓）'
    },
    {
      id: 'spray',
      emoji: '💦',
      name: '防蟑蟻噴劑',
      desc: '防治蟑螂和螞蟻'
    },
    {
      id: 'bacillus',
      emoji: '🧫',
      name: '枯草菌',
      desc: '分解有機物、消除管路異味'
    }
  ];

  // ────────────────────────────────
  //  6 題情境（預設）
  // ────────────────────────────────
  const DEFAULT_QUESTIONS = [
    {
      emoji: '🪲',
      title: '廚房排水管出現小蛾蚋',
      desc: '排水管口附近飛著一群小小的飛蟲，那是蛾蚋（孑孓）。',
      answer: 'drain',
      explain: '🔍 蛾蚋幼蟲孳生於管道積污中。使用**溝渠劑**倒入排水管，可殺滅幼蟲，斷絕生長來源。'
    },
    {
      emoji: '🪳',
      title: '架房角落發現蟑螂',
      desc: '打掃時在牆角縫隙看到蟑螂出沒的痕跡。',
      answer: 'spray',
      explain: '🔍 發現蟑螂活動跡象，使用**防蟑蟻噴劑**噴灑在縫隙、角落等常見藏匿處。'
    },
    {
      emoji: '💨',
      title: '廁所散發不明異味',
      desc: '廁所地漏和管道持續發出臭味，清洗後仍難消除。',
      answer: 'bacillus',
      explain: '🔍 管道異味多來自有機物堆積和細菌。**枯草菌**能分解有機殘留，從根本消除臭味。'
    },
    {
      emoji: '🐜',
      title: '場所看到螞蟻行進',
      desc: '地板上發現一列螞蟻，正往某個方向前進。',
      answer: 'spray',
      explain: '🔍 螞蟻通常沿費洛蒙氣味路徑行進。使用**防蟑蟻噴劑**沿行進路線噴灑，並找到可能入侵點加強防範。'
    },
    {
      emoji: '🚿',
      title: '淋浴間地漏積水有臭味',
      desc: '淋浴間地漏排水不順，積水時傳出異臭。',
      answer: 'bacillus',
      explain: '🔍 地漏積污分解產生臭味。倒入**枯草菌**，讓菌種分解有機物，在下線前使用效果最佳。'
    },
    {
      emoji: '🪲',
      title: '地下室管道孳生蛾蚋幼蟲',
      desc: '地下室積水處出現大量蛾蚋孑孓，影響環境衛生。',
      answer: 'drain',
      explain: '🔍 積水是蛾蚋孑孓的溫床。使用**溝渠劑**倒入積水管道，殺滅幼蟲並預防孳生。'
    }
  ];

  const savedBM = localStorage.getItem('ctcm_biomatch_custom');
  const questions = savedBM ? JSON.parse(savedBM) : DEFAULT_QUESTIONS;

  let current = 0;
  let score = 0;
  let answered = false;

  function render() {
    const area = document.getElementById('game-area');

    if (current >= questions.length) {
      area.innerHTML = `
        <div class="result-screen">
          <span class="result-emoji">${score === 6 ? '🏆' : score >= 4 ? '🌟' : '💪'}</span>
          <div class="result-score">${score} / ${questions.length}</div>
          <div class="result-message">
            ${score === 6 ? '全對！生物防治達人！' : score >= 4 ? '掌握得不錯！' : '再複習一下，加油！'}
          </div>
          <button class="btn-restart" onclick="restart()">再玩一次</button>
          <button class="btn-restart" style="background:linear-gradient(135deg,#42a5f5,#1565c0)" onclick="location.href='../../themes/bio.html'">返回主題</button>
        </div>`;
      return;
    }

    const q = questions[current];
    document.getElementById('score').textContent = score;

    area.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-label">第 ${current + 1} / ${questions.length} 題</div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${(current / questions.length) * 100}%"></div>
        </div>
      </div>

      <div class="question-card">
        <span class="situation-emoji">${q.emoji}</span>
        <div class="situation-title">${q.title}</div>
        <div class="situation-desc">${q.desc}</div>
      </div>

      <p style="text-align:center;font-weight:700;color:var(--text-light);margin-bottom:0.8rem">
        用哪種防治工具最適合？
      </p>

      <div class="tools-grid">
        ${tools.map(t => `
          <button class="tool-btn" id="tool-${t.id}" onclick="pick('${t.id}')">
            <span class="tool-emoji">${t.emoji}</span>
            <span class="tool-name">${t.name}</span>
            <span class="tool-desc">${t.desc}</span>
          </button>
        `).join('')}
      </div>

      <div class="explain-box" id="explain-box">${q.explain}</div>

      <div class="action-row" style="margin-top:1.2rem">
        <button class="btn-submit" id="btn-next" style="display:none;background:linear-gradient(135deg,#ffb74d,#e65100)"
          onclick="nextQ()">
          ${current + 1 < questions.length ? '下一題 →' : '查看結果 →'}
        </button>
      </div>`;

    answered = false;
  }

  function pick(toolId) {
    if (answered) return;
    answered = true;

    const q = questions[current];
    const isCorrect = toolId === q.answer;

    // 標記所有按鈕
    tools.forEach(t => {
      const btn = document.getElementById(`tool-${t.id}`);
      btn.disabled = true;
      if (t.id === q.answer) btn.classList.add('correct');
    });
    if (!isCorrect) {
      document.getElementById(`tool-${toolId}`).classList.add('wrong');
    }

    if (isCorrect) {
      score++;
      document.getElementById('score').textContent = score;
    }

    document.getElementById('explain-box').classList.add('visible');
    document.getElementById('btn-next').style.display = 'inline-block';
  }

  function nextQ() {
    current++;
    render();
  }

  function restart() {
    current = 0;
    score = 0;
    render();
  }

  render();
  </script>
</body>
</html>
