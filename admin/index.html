<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台管理 | 環保小遊戲</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:      #43a047;
      --green-dark: #2e7d32;
      --green-bg:   #e8f5e9;
      --red:        #e53935;
      --red-bg:     #ffebee;
      --blue-bg:    #e3f2fd;
      --blue:       #1565c0;
      --text:       #2e2e2e;
      --text-light: #757575;
      --border:     #e0e0e0;
      --bg:         #f5f5f5;
      --white:      #ffffff;
      --radius:     12px;
      --shadow:     0 2px 12px rgba(0,0,0,0.08);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      min-height: 100vh;
    }

    /* ── 登入畫面 ── */
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .login-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-icon { font-size: 4rem; margin-bottom: 1rem; }
    .login-card h2 { font-size: 1.8rem; font-weight: 900; color: var(--green-dark); margin-bottom: 0.5rem; }
    .login-card p  { color: var(--text-light); margin-bottom: 1.5rem; }
    .login-pw-hint { font-size: 0.85rem; color: var(--text-light); margin-top: 1rem; }
    .login-error { color: var(--red); font-size: 0.9rem; margin-top: 0.5rem; min-height: 1.2rem; }

    /* ── 共用輸入元件 ── */
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--green); }
    textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

    /* ── 共用按鈕 ── */
    .btn-primary {
      background: var(--green);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.2s, transform 0.15s;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary.full  { width: 100%; padding: 0.9rem; font-size: 1.1rem; }

    .btn-danger {
      background: var(--red);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-danger:hover { filter: brightness(1.1); }

    .btn-outline {
      background: white;
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-outline:hover { border-color: var(--green); background: var(--green-bg); }

    .btn-sm-edit {
      background: #e3f2fd;
      color: var(--blue);
      border: none;
      border-radius: 8px;
      padding: 0.35rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-sm-del {
      background: var(--red-bg);
      color: var(--red);
      border: none;
      border-radius: 8px;
      padding: 0.35rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    /* ── 頂部導覽 ── */
    .admin-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--white);
      border-bottom: 2px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .admin-nav-title { font-size: 1.3rem; font-weight: 900; color: var(--green-dark); }
    .admin-nav-actions { display: flex; gap: 0.6rem; align-items: center; }

    /* ── Tab 導覽 ── */
    .tab-bar {
      display: flex;
      gap: 0;
      background: var(--white);
      border-bottom: 2px solid var(--border);
      padding: 0 1.5rem;
      overflow-x: auto;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 0.9rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text-light);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      margin-bottom: -2px;
    }
    .tab-btn.active { color: var(--green-dark); border-bottom-color: var(--green); }
    .tab-btn:hover  { color: var(--green); }

    /* ── 分頁內容 ── */
    .tab-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* 工具列 */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .count-label { font-size: 0.9rem; color: var(--text-light); flex: 1; }

    /* ── 列表卡片 ── */
    .item-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 2px solid var(--border);
      padding: 1rem 1.2rem;
      margin-bottom: 0.7rem;
      transition: border-color 0.2s;
    }
    .item-card:hover { border-color: #bdbdbd; }

    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
    }
    .item-actions { margin-left: auto; display: flex; gap: 0.4rem; flex-shrink: 0; }
    .item-q    { font-weight: 600; font-size: 0.95rem; line-height: 1.5; flex: 1; }
    .item-meta { font-size: 0.85rem; color: var(--text-light); margin-top: 0.25rem; }

    /* 標籤 */
    .tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tag-green { background: var(--green-bg); color: var(--green-dark); }
    .tag-blue  { background: var(--blue-bg);  color: var(--blue); }
    .tag-red   { background: var(--red-bg);   color: var(--red); }
    .tag-orange{ background: #fff3e0;          color: #e65100; }

    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-light);
      font-size: 1.05rem;
    }
    .empty-state span { font-size: 3rem; display: block; margin-bottom: 0.8rem; }

    /* ── 設定區 ── */
    .settings-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 2px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 1.2rem;
    }
    .settings-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.2rem; color: var(--green-dark); }
    .form-row { margin-bottom: 0.9rem; }
    .form-label { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.35rem; display: block; }

    /* ── 找找看：關卡區塊 ── */
    .round-section {
      background: var(--white);
      border-radius: var(--radius);
      border: 2px solid var(--border);
      margin-bottom: 1.2rem;
      overflow: hidden;
    }
    .round-header {
      background: var(--green-bg);
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
    }
    .round-header-title { font-weight: 900; color: var(--green-dark); font-size: 1rem; }
    .round-items { padding: 0.5rem 0.8rem; }
    .round-items .item-card { margin-bottom: 0.5rem; }
    .round-items .item-card:last-child { margin-bottom: 0; }

    /* ── 枯草菌：選項列 ── */
    .choice-row {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 0.8rem;
      margin-bottom: 0.7rem;
      background: #fafafa;
    }
    .choice-row-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .choice-row-header input[type=radio] {
      width: auto;
      padding: 0;
      accent-color: var(--green);
    }
    .choice-warn-label {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.4rem;
      display: block;
    }

    /* ── 表單 overlay ── */
    .form-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-y: auto;
    }
    .form-card {
      background: var(--white);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .form-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .form-card-title { font-size: 1.3rem; font-weight: 900; color: var(--green-dark); }
    .btn-close {
      background: var(--bg);
      border: none;
      border-radius: 50%;
      width: 2.2rem;
      height: 2.2rem;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
    }
    .btn-close:hover { background: var(--border); }
    .form-footer {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
      justify-content: flex-end;
    }
    .two-col { display: grid; grid-template-columns: 1fr 3fr; gap: 0.6rem; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #212121;
      color: white;
      padding: 0.7rem 1.5rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      z-index: 999;
    }

    /* ── 工具 ── */
    .hidden { display: none !important; }
    .info-box {
      background: #fff9c4;
      border: 2px solid #fbc02d;
      border-radius: var(--radius);
      padding: 0.7rem 1.1rem;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
      color: #f57f17;
      line-height: 1.7;
    }

    @media (max-width: 520px) {
      .tab-btn { padding: 0.7rem 0.8rem; font-size: 0.85rem; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ① 登入畫面 -->
  <div id="screen-login" class="login-wrap">
    <div class="login-card">
      <div class="login-icon">🔐</div>
      <h2>後台管理</h2>
      <p>請輸入管理密碼</p>
      <input type="password" id="pw-input" placeholder="輸入密碼…" autocomplete="current-password">
      <div id="login-error" class="login-error"></div>
      <button class="btn-primary full" onclick="doLogin()" style="margin-top:1rem">登入</button>
      <p class="login-pw-hint">預設密碼：ctcm2026</p>
    </div>
  </div>

  <!-- ② 管理主畫面 -->
  <div id="screen-admin" class="hidden">

    <nav class="admin-nav">
      <span class="admin-nav-title">⚙️ 後台管理</span>
      <div class="admin-nav-actions">
        <a href="../index.html" class="btn-outline">← 回首頁</a>
        <button class="btn-outline" onclick="doLogout()">登出</button>
      </div>
    </nav>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="spoterror"    onclick="switchTab('spoterror')">🔍 找找看</button>
      <button class="tab-btn"        data-tab="recyclesteps" onclick="switchTab('recyclesteps')">📦 回收前怎麼做</button>
      <button class="tab-btn"        data-tab="sorting"      onclick="switchTab('sorting')">♻️ 垃圾大分類</button>
      <button class="tab-btn"        data-tab="biomatch"     onclick="switchTab('biomatch')">🎯 配對挑戰</button>
      <button class="tab-btn"        data-tab="bacillus"     onclick="switchTab('bacillus')">🧪 枯草菌操作</button>
      <button class="tab-btn"        data-tab="settings"     onclick="switchTab('settings')">🔧 設定</button>
    </div>

    <!-- Tab: 找找看 -->
    <div id="tab-spoterror" class="tab-content">
      <div class="toolbar">
        <span class="count-label">固定 3 關 × 4 情境卡，可編輯文字和錯誤標記（圖片路徑固定）</span>
        <button class="btn-danger" onclick="resetToDefault('spoterror')">↺ 重置預設</button>
      </div>
      <div id="spoterror-rounds"></div>
    </div>

    <!-- Tab: 回收前怎麼做 -->
    <div id="tab-recyclesteps" class="tab-content hidden">
      <div class="toolbar">
        <button class="btn-primary" onclick="openForm('recyclesteps', null)">＋ 新增題目</button>
        <span class="count-label" id="recyclesteps-count"></span>
        <button class="btn-danger" onclick="resetToDefault('recyclesteps')">↺ 重置預設</button>
      </div>
      <div id="recyclesteps-list"></div>
    </div>

    <!-- Tab: 垃圾大分類 -->
    <div id="tab-sorting" class="tab-content hidden">
      <div class="toolbar">
        <button class="btn-primary" onclick="openForm('sorting', null)">＋ 新增物品</button>
        <span class="count-label" id="sorting-count"></span>
        <button class="btn-danger" onclick="resetToDefault('sorting')">↺ 重置預設</button>
      </div>
      <div id="sorting-list"></div>
    </div>

    <!-- Tab: 配對挑戰 -->
    <div id="tab-biomatch" class="tab-content hidden">
      <div class="toolbar">
        <button class="btn-primary" onclick="openForm('biomatch', null)">＋ 新增情境</button>
        <span class="count-label" id="biomatch-count"></span>
        <button class="btn-danger" onclick="resetToDefault('biomatch')">↺ 重置預設</button>
      </div>
      <div id="biomatch-list"></div>
    </div>

    <!-- Tab: 枯草菌操作 -->
    <div id="tab-bacillus" class="tab-content hidden">
      <div class="toolbar">
        <span class="count-label">固定 5 個操作步驟，只能編輯各步驟的內容</span>
        <button class="btn-danger" onclick="resetToDefault('bacillus')">↺ 重置預設</button>
      </div>
      <div id="bacillus-list"></div>
    </div>

    <!-- Tab: 設定 -->
    <div id="tab-settings" class="tab-content hidden">

      <div class="settings-card">
        <h3>📊 Google Sheets 串接</h3>
        <p style="color:var(--text-light);font-size:0.95rem;margin-bottom:1.2rem;line-height:1.8">
          設定後，「垃圾大分類」題目可從 Google 試算表同步。<br>
          Apps Script 程式碼請參考 <code style="background:#f5f5f5;padding:0.1rem 0.4rem;border-radius:4px">admin/apps-script.js</code>
        </p>
        <div class="form-row">
          <label class="form-label">Apps Script 網址</label>
          <input type="text" id="script-url" placeholder="https://script.google.com/macros/s/...">
        </div>
        <div style="display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;margin-top:0.5rem">
          <button class="btn-primary" onclick="saveScriptUrl()">儲存網址</button>
          <button class="btn-outline" id="btn-sync" onclick="manualSync()">🔄 立即同步</button>
          <span id="sync-status" style="font-size:0.85rem;color:var(--text-light)"></span>
        </div>
      </div>

      <div class="settings-card">
        <h3>🔑 修改管理密碼</h3>
        <div class="form-row">
          <label class="form-label">目前密碼</label>
          <input type="password" id="pw-current" placeholder="輸入目前密碼">
        </div>
        <div class="form-row">
          <label class="form-label">新密碼</label>
          <input type="password" id="pw-new" placeholder="輸入新密碼">
        </div>
        <div class="form-row">
          <label class="form-label">確認新密碼</label>
          <input type="password" id="pw-confirm" placeholder="再輸入一次新密碼">
        </div>
        <button class="btn-primary" onclick="changePassword()">更新密碼</button>
      </div>

      <div class="settings-card">
        <h3>🗑️ 清除所有自訂資料</h3>
        <p style="color:var(--text-light);font-size:0.95rem;margin-bottom:1rem;line-height:1.7">
          清除後，所有遊戲將回到預設題目。此操作無法復原。
        </p>
        <button class="btn-danger" onclick="clearAllData()">清除全部自訂資料</button>
      </div>
    </div>

  </div><!-- /screen-admin -->

  <!-- ③ 表單 overlay -->
  <div id="form-overlay" class="form-overlay hidden" onclick="handleOverlayClick(event)">
    <div class="form-card" id="form-card">
      <div class="form-card-header">
        <span class="form-card-title" id="form-title">編輯</span>
        <button class="btn-close" onclick="closeForm()">✕</button>
      </div>

      <!-- 找找看：關卡標題 -->
      <div id="spoterror-round-form" class="hidden">
        <div class="form-row">
          <label class="form-label">關卡標題</label>
          <input type="text" id="f-round-title" placeholder="例如：打掃前準備">
        </div>
      </div>

      <!-- 找找看：情境卡片 -->
      <div id="spoterror-item-form" class="hidden">
        <div class="form-row">
          <label class="form-label">工具 / 名稱</label>
          <input type="text" id="f-item-label" placeholder="例如：三角立牌">
        </div>
        <div class="form-row">
          <label class="form-label">操作描述文字</label>
          <textarea id="f-item-desc" placeholder="描述這個情境的操作內容…"></textarea>
        </div>
        <div class="form-row">
          <label class="form-label" style="display:flex;align-items:center;gap:0.6rem;cursor:pointer">
            <input type="checkbox" id="f-item-iserror" style="width:auto;padding:0;margin:0;accent-color:var(--red)">
            <span>這是「錯誤」操作（勾選 = ❌ 錯誤，不勾 = ✅ 正確）</span>
          </label>
        </div>
        <div class="form-row">
          <label class="form-label">揭曉後的說明</label>
          <textarea id="f-item-explain" placeholder="正確或錯誤的原因說明，例如：❌ 錯誤！正確作法是…"></textarea>
        </div>
      </div>

      <!-- 回收前怎麼做：題目 -->
      <div id="recyclesteps-form" class="hidden">
        <div class="two-col">
          <div class="form-row">
            <label class="form-label">圖示</label>
            <input type="text" id="f-rs-emoji" placeholder="🧃">
          </div>
          <div class="form-row">
            <label class="form-label">物品名稱</label>
            <input type="text" id="f-rs-name" placeholder="例如：鋁箔包（利樂包）">
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">題目問題</label>
          <textarea id="f-rs-question" placeholder="回收前需要做哪些處理？"></textarea>
        </div>
        <div class="form-row">
          <label class="form-label">四個選項（A / B / C / D）</label>
          <div style="display:flex;flex-direction:column;gap:0.5rem">
            <input type="text" id="f-rs-opt-0" placeholder="選項 A">
            <input type="text" id="f-rs-opt-1" placeholder="選項 B">
            <input type="text" id="f-rs-opt-2" placeholder="選項 C">
            <input type="text" id="f-rs-opt-3" placeholder="選項 D">
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">正確答案</label>
          <select id="f-rs-correct">
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label">解析說明</label>
          <textarea id="f-rs-explain" placeholder="🔍 解析說明…"></textarea>
        </div>
      </div>

      <!-- 垃圾大分類：物品 -->
      <div id="sorting-form" class="hidden">
        <div class="form-row">
          <label class="form-label">物品名稱</label>
          <input type="text" id="f-name" placeholder="例如：報紙">
        </div>
        <div class="form-row">

  /* ── 儲存 Key ── */
  const KEYS = {
    spoterror:    'ctcm_spoterror_custom',
    recyclesteps: 'ctcm_recyclesteps_custom',
    sorting:      'ctcm_sorting_custom',
    biomatch:     'ctcm_biomatch_custom',
    bacillus:     'ctcm_bacillus_custom',
    password:     'ctcm_admin_password',
  };
  const SCRIPT_URL_KEY = 'ctcm_apps_script_url';
  const LAST_SYNC_KEY  = 'ctcm_last_sync';
  const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuz80_jqKX0JBqFW6No-pAGnEfikbfaU9-oq_z892HernsfM2pTqZJB_x2yLq49eF8/exec';
  const DEFAULT_PASSWORD = 'ctcm2026';

  /* ── 工作資料 ── */
  const data = { spoterror: [], recyclesteps: [], sorting: [], biomatch: [], bacillus: [] };
  let editState = null;
  let currentTab = 'spoterror';

  /* ── 登入 / 登出 ── */
  function doLogin() {
    const input  = document.getElementById('pw-input').value;
    const stored = localStorage.getItem(KEYS.password) || DEFAULT_PASSWORD;
    if (input === stored) {
      document.getElementById('login-error').textContent = '';
      showScreen('admin');
      loadData();
    } else {
      document.getElementById('login-error').textContent = '密碼錯誤，請再試一次';
      document.getElementById('pw-input').focus();
    }
  }
  function doLogout() {
    document.getElementById('pw-input').value = '';
    showScreen('login');
  }

  /* ── 資料讀取 ── */
  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function loadData() {
    const cse = localStorage.getItem(KEYS.spoterror);
    data.spoterror = cse ? JSON.parse(cse) : deepClone(DEFAULT_SPOTERROR);

    const crs = localStorage.getItem(KEYS.recyclesteps);
    data.recyclesteps = crs ? JSON.parse(crs) : deepClone(DEFAULT_RECYCLESTEPS);

    const cs = localStorage.getItem(KEYS.sorting);
    data.sorting = cs ? JSON.parse(cs) : DEFAULT_SORTING.map(i => ({...i}));

    const cbm = localStorage.getItem(KEYS.biomatch);
    data.biomatch = cbm ? JSON.parse(cbm) : deepClone(DEFAULT_BIOMATCH);

    const cbac = localStorage.getItem(KEYS.bacillus);
    data.bacillus = cbac ? JSON.parse(cbac) : deepClone(DEFAULT_BACILLUS);

    renderAll();
  }

  /* ── 資料儲存 ── */
  function persistData(type) {
    localStorage.setItem(KEYS[type], JSON.stringify(data[type]));
  }

  /* ── 重置預設 ── */
  function resetToDefault(type) {
    const labels = { spoterror:'找找看', recyclesteps:'回收前怎麼做', sorting:'垃圾大分類', biomatch:'配對挑戰', bacillus:'枯草菌操作' };
    if (!confirm(`確定要重置「${labels[type]}」為預設資料嗎？\n所有修改都會消失，無法復原！`)) return;
    localStorage.removeItem(KEYS[type]);
    switch(type) {
      case 'spoterror':    data.spoterror    = deepClone(DEFAULT_SPOTERROR);    break;
      case 'recyclesteps': data.recyclesteps = deepClone(DEFAULT_RECYCLESTEPS); break;
      case 'sorting':      data.sorting      = DEFAULT_SORTING.map(i => ({...i})); break;
      case 'biomatch':     data.biomatch     = deepClone(DEFAULT_BIOMATCH);     break;
      case 'bacillus':     data.bacillus     = deepClone(DEFAULT_BACILLUS);     break;
    }
    renderAll();
    showToast('已重置為預設資料');
  }

  /* ── 清除全部 ── */
  function clearAllData() {
    if (!confirm('確定要清除所有自訂資料嗎？遊戲將回到預設題目，此操作無法復原！')) return;
    Object.values(KEYS).filter(k => k !== KEYS.password).forEach(k => localStorage.removeItem(k));
    loadData();
    showToast('已清除所有自訂資料');
  }

  /* ── 渲染全部 ── */
  function renderAll() {
    renderSpotError();
    renderRecycleSteps();
    renderSorting();
    renderBioMatch();
    renderBacillus();
  }

  /* ── 渲染：找找看 ── */
  function renderSpotError() {
    const container = document.getElementById('spoterror-rounds');
    if (!container) return;
    container.innerHTML = data.spoterror.map((round, ri) => `
      <div class="round-section">
        <div class="round-header">
          <span class="round-header-title">第 ${ri + 1} 關：${round.title}</span>
          <button class="btn-sm-edit" onclick="openForm('spoterror-round', ${ri})">✏️ 編輯標題</button>
        </div>
        <div class="round-items">
          ${round.items.map((item, ii) => `
            <div class="item-card">
              <div class="item-header">
                <span class="tag ${item.isError ? 'tag-red' : 'tag-green'}">${item.isError ? '❌ 錯誤' : '✅ 正確'}</span>
                <span class="item-q">${item.label}：${item.desc}</span>
                <div class="item-actions">
                  <button class="btn-sm-edit" onclick="openForm('spoterror-item', ${ri}, ${ii})">編輯</button>
                </div>
              </div>
              <div class="item-meta">說明：${item.explain}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  /* ── 渲染：回收前怎麼做 ── */
  function renderRecycleSteps() {
    document.getElementById('recyclesteps-count').textContent = `共 ${data.recyclesteps.length} 題`;
    const list = document.getElementById('recyclesteps-list');
    if (!data.recyclesteps.length) {
      list.innerHTML = '<div class="empty-state"><span>📭</span>還沒有題目，點上方「新增題目」開始！</div>';
      return;
    }
    list.innerHTML = data.recyclesteps.map((q, i) => `
      <div class="item-card">
        <div class="item-header">
          <span style="font-size:1.6rem;flex-shrink:0">${q.emoji}</span>
          <span class="item-q">${q.name}：${q.question}</span>
          <div class="item-actions">
            <button class="btn-sm-edit" onclick="openForm('recyclesteps', ${i})">編輯</button>
            <button class="btn-sm-del"  onclick="deleteItem('recyclesteps', ${i})">刪除</button>
          </div>
        </div>
        <div class="item-meta">正確答案：${q.options.find(o => o.correct)?.text || '—'}</div>
      </div>
    `).join('');
  }

  /* ── 渲染：垃圾大分類 ── */
  function renderSorting() {
    document.getElementById('sorting-count').textContent = `共 ${data.sorting.length} 項`;
    const list = document.getElementById('sorting-list');
    if (!data.sorting.length) {
      list.innerHTML = '<div class="empty-state"><span>📭</span>還沒有物品，點上方「新增物品」開始！</div>';
      return;
    }
    list.innerHTML = data.sorting.map((item, i) => `
      <div class="item-card">
        <div class="item-header">
          <span style="font-size:1.6rem;flex-shrink:0">${item.emoji}</span>
          <span class="item-q">${item.name}</span>
          <div class="item-actions">
            <button class="btn-sm-edit" onclick="openForm('sorting', ${i})">編輯</button>
            <button class="btn-sm-del"  onclick="deleteItem('sorting', ${i})">刪除</button>
          </div>
        </div>
        <div class="item-meta">類別：${item.bin}　提示：${item.hint}</div>
      </div>
    `).join('');
  }

  /* ── 渲染：配對挑戰 ── */
  function renderBioMatch() {
    document.getElementById('biomatch-count').textContent = `共 ${data.biomatch.length} 題`;
    const list = document.getElementById('biomatch-list');
    if (!data.biomatch.length) {
      list.innerHTML = '<div class="empty-state"><span>📭</span>還沒有情境，點上方「新增情境」開始！</div>';
      return;
    }
    const toolLabels = { drain: '🟤 溝渠劑', spray: '💦 防蟑蟻噴劑', bacillus: '🧫 枯草菌' };
    list.innerHTML = data.biomatch.map((q, i) => `
      <div class="item-card">
        <div class="item-header">
          <span style="font-size:1.6rem;flex-shrink:0">${q.emoji}</span>
          <span class="item-q">${q.title}</span>
          <div class="item-actions">
            <button class="btn-sm-edit" onclick="openForm('biomatch', ${i})">編輯</button>
            <button class="btn-sm-del"  onclick="deleteItem('biomatch', ${i})">刪除</button>
          </div>
        </div>
        <div class="item-meta">正確工具：${toolLabels[q.answer] || q.answer}</div>
      </div>
    `).join('');
  }

  /* ── 渲染：枯草菌操作 ── */
  function renderBacillus() {
    const list = document.getElementById('bacillus-list');
    if (!list) return;
    list.innerHTML = data.bacillus.map((s, i) => `
      <div class="item-card">
        <div class="item-header">
          <span style="font-size:1.6rem;flex-shrink:0">${s.emoji}</span>
          <span class="item-q">步驟 ${i + 1}：${s.title}</span>
          <div class="item-actions">
            <button class="btn-sm-edit" onclick="openForm('bacillus', ${i})">編輯</button>
          </div>
        </div>
        <div class="item-meta">問題：${s.question}</div>
      </div>
    `).join('');
  }

  /* ── 刪除項目 ── */
  function deleteItem(type, index) {
    const labelMap = {
      recyclesteps: () => `題目「${data.recyclesteps[index].name}」`,
      sorting:      () => `物品「${data.sorting[index].name}」`,
      biomatch:     () => `情境「${data.biomatch[index].title}」`,
    };
    if (!confirm(`確定要刪除這個${labelMap[type]()}嗎？`)) return;
    data[type].splice(index, 1);
    persistData(type);
    if (type === 'recyclesteps') renderRecycleSteps();
    if (type === 'sorting')      renderSorting();
    if (type === 'biomatch')     renderBioMatch();
    showToast('刪除成功');
  }

  /* ── 開啟表單 ── */
  function openForm(type, a, b) {
    editState = { type, a, b };
    const ALL_FORMS = ['spoterror-round-form','spoterror-item-form','recyclesteps-form',
                       'sorting-form','biomatch-form','bacillus-form'];
    ALL_FORMS.forEach(id => document.getElementById(id).classList.add('hidden'));

    if (type === 'spoterror-round') {
      document.getElementById('form-title').textContent = `編輯第 ${a + 1} 關標題`;
      document.getElementById('f-round-title').value = data.spoterror[a].title;
      document.getElementById('spoterror-round-form').classList.remove('hidden');

    } else if (type === 'spoterror-item') {
      const item = data.spoterror[a].items[b];
      document.getElementById('form-title').textContent = '編輯情境卡片';
      document.getElementById('f-item-label').value = item.label;
      document.getElementById('f-item-desc').value  = item.desc;
      document.getElementById('f-item-iserror').checked = item.isError;
      document.getElementById('f-item-explain').value   = item.explain;
      document.getElementById('spoterror-item-form').classList.remove('hidden');

    } else if (type === 'recyclesteps') {
      const isEdit = a !== null;
      document.getElementById('form-title').textContent = isEdit ? '編輯題目' : '新增題目';
      const q = isEdit ? data.recyclesteps[a] : null;
      document.getElementById('f-rs-emoji').value    = q ? q.emoji    : '';
      document.getElementById('f-rs-name').value     = q ? q.name     : '';
      document.getElementById('f-rs-question').value = q ? q.question : '';
      [0,1,2,3].forEach(i => {
        document.getElementById(`f-rs-opt-${i}`).value = q ? (q.options[i]?.text || '') : '';
      });
      if (q) {
        const ci = q.options.findIndex(o => o.correct);
        document.getElementById('f-rs-correct').value = ci >= 0 ? ci : 0;
      } else {
        document.getElementById('f-rs-correct').value = '0';
      }
      document.getElementById('f-rs-explain').value = q ? q.explain : '';
      document.getElementById('recyclesteps-form').classList.remove('hidden');

    } else if (type === 'sorting') {
      const isEdit = a !== null;
      document.getElementById('form-title').textContent = isEdit ? '編輯物品' : '新增物品';
      const item = isEdit ? data.sorting[a] : null;
      document.getElementById('f-name').value  = item ? item.name  : '';
      document.getElementById('f-emoji').value = item ? item.emoji : '';
      document.getElementById('f-bin').value   = item ? item.bin   : '一般垃圾';
      document.getElementById('f-hint').value  = item ? item.hint  : '';
      document.getElementById('sorting-form').classList.remove('hidden');

    } else if (type === 'biomatch') {
      const isEdit = a !== null;
      document.getElementById('form-title').textContent = isEdit ? '編輯情境' : '新增情境';
      const q = isEdit ? data.biomatch[a] : null;
      document.getElementById('f-bm-emoji').value   = q ? q.emoji   : '';
      document.getElementById('f-bm-title').value   = q ? q.title   : '';
      document.getElementById('f-bm-desc').value    = q ? q.desc    : '';
      document.getElementById('f-bm-answer').value  = q ? q.answer  : 'drain';
      document.getElementById('f-bm-explain').value = q ? q.explain : '';
      document.getElementById('biomatch-form').classList.remove('hidden');

    } else if (type === 'bacillus') {
      const s = data.bacillus[a];
      document.getElementById('form-title').textContent = `編輯步驟 ${a + 1}`;
      document.getElementById('f-bac-emoji').value    = s.emoji;
      document.getElementById('f-bac-title').value    = s.title;
      document.getElementById('f-bac-question').value = s.question;
      document.getElementById('f-bac-explain').value  = s.explain;
      document.getElementById('f-bac-summary').value  = s.summary || '';
      s.choices.forEach((c, i) => {
        document.getElementById(`f-bac-choice-${i}`).value = c.text;
        document.getElementById(`f-bac-warn-${i}`).value   = c.warn || '';
      });
      const correctIdx = s.choices.findIndex(c => c.correct);
      const radio = document.querySelector(`input[name="f-bac-correct"][value="${correctIdx >= 0 ? correctIdx : 0}"]`);
      if (radio) radio.checked = true;
      document.getElementById('bacillus-form').classList.remove('hidden');
    }

    document.getElementById('form-overlay').classList.remove('hidden');
  }

  /* ── 關閉表單 ── */
  function closeForm() {
    document.getElementById('form-overlay').classList.add('hidden');
    editState = null;
  }
  function handleOverlayClick(e) {
    if (e.target === document.getElementById('form-overlay')) closeForm();
  }

  /* ── 儲存表單 ── */
  function saveForm() {
    const { type, a, b } = editState;

    if (type === 'spoterror-round') {
      const title = document.getElementById('f-round-title').value.trim();
      if (!title) { alert('請填寫關卡標題！'); return; }
      data.spoterror[a].title = title;
      persistData('spoterror');
      renderSpotError();

    } else if (type === 'spoterror-item') {
      const label   = document.getElementById('f-item-label').value.trim();
      const desc    = document.getElementById('f-item-desc').value.trim();
      const isError = document.getElementById('f-item-iserror').checked;
      const explain = document.getElementById('f-item-explain').value.trim();
      if (!label || !desc || !explain) { alert('請填寫所有欄位！'); return; }
      data.spoterror[a].items[b] = { ...data.spoterror[a].items[b], label, desc, isError, explain };
      persistData('spoterror');
      renderSpotError();

    } else if (type === 'recyclesteps') {
      const isEdit  = a !== null;
      const emoji   = document.getElementById('f-rs-emoji').value.trim();
      const name    = document.getElementById('f-rs-name').value.trim();
      const question= document.getElementById('f-rs-question').value.trim();
      const opts    = [0,1,2,3].map(i => document.getElementById(`f-rs-opt-${i}`).value.trim());
      const ci      = parseInt(document.getElementById('f-rs-correct').value);
      const explain = document.getElementById('f-rs-explain').value.trim();
      if (!emoji || !name || !question || opts.some(o => !o) || !explain) {
        alert('請填寫所有欄位！'); return;
      }
      const item = { emoji, name, question, options: opts.map((text, i) => ({ text, correct: i === ci })), explain };
      if (isEdit) data.recyclesteps[a] = item; else data.recyclesteps.push(item);
      persistData('recyclesteps');
      renderRecycleSteps();

    } else if (type === 'sorting') {
      const isEdit = a !== null;
      const name   = document.getElementById('f-name').value.trim();
      const emoji  = document.getElementById('f-emoji').value.trim();
      const bin    = document.getElementById('f-bin').value;
      const hint   = document.getElementById('f-hint').value.trim();
      if (!name || !emoji || !hint) { alert('請填寫所有欄位！'); return; }
      const item = { name, emoji, bin, hint };
      if (isEdit) data.sorting[a] = item; else data.sorting.push(item);
      persistData('sorting');
      renderSorting();

    } else if (type === 'biomatch') {
      const isEdit  = a !== null;
      const emoji   = document.getElementById('f-bm-emoji').value.trim();
      const title   = document.getElementById('f-bm-title').value.trim();
      const desc    = document.getElementById('f-bm-desc').value.trim();
      const answer  = document.getElementById('f-bm-answer').value;
      const explain = document.getElementById('f-bm-explain').value.trim();
      if (!emoji || !title || !desc || !explain) { alert('請填寫所有欄位！'); return; }
      const item = { emoji, title, desc, answer, explain };
      if (isEdit) data.biomatch[a] = item; else data.biomatch.push(item);
      persistData('biomatch');
      renderBioMatch();

    } else if (type === 'bacillus') {
      const emoji    = document.getElementById('f-bac-emoji').value.trim();
      const title    = document.getElementById('f-bac-title').value.trim();
      const question = document.getElementById('f-bac-question').value.trim();
      const explain  = document.getElementById('f-bac-explain').value.trim();
      const summary  = document.getElementById('f-bac-summary').value.trim();
      const radioEl  = document.querySelector('input[name="f-bac-correct"]:checked');
      if (!emoji || !title || !question || !explain) { alert('請填寫所有必填欄位！'); return; }
      if (!radioEl) { alert('請選擇正確答案！'); return; }
      const correctIdx = parseInt(radioEl.value);
      const choices = [0,1,2].map(i => {
        const text = document.getElementById(`f-bac-choice-${i}`).value.trim();
        if (!text) return null;
        const warn = document.getElementById(`f-bac-warn-${i}`).value.trim();
        return i === correctIdx
          ? { text, correct: true, warn: '' }
          : { text, correct: false, warn: warn || '⚠️ 不對喔，請再想想！' };
      });
      if (choices.some(c => !c)) { alert('請填寫所有選項文字！'); return; }
      data.bacillus[a] = { ...data.bacillus[a], emoji, title, question, choices, explain, summary };
      persistData('bacillus');
      renderBacillus();
    }

    closeForm();
    showToast('儲存成功！');
  }

  /* ── 切換 Tab ── */
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.getElementById(`tab-${tab}`).classList.remove('hidden');
    if (tab === 'settings') loadScriptUrlField();
  }

  /* ── 修改密碼 ── */
  function changePassword() {
    const cur    = document.getElementById('pw-current').value;
    const nw     = document.getElementById('pw-new').value;
    const conf   = document.getElementById('pw-confirm').value;
    const stored = localStorage.getItem(KEYS.password) || DEFAULT_PASSWORD;
    if (cur !== stored) { alert('目前密碼錯誤！'); return; }
    if (!nw)            { alert('新密碼不能為空！'); return; }
    if (nw !== conf)    { alert('兩次輸入的密碼不一致！'); return; }
    localStorage.setItem(KEYS.password, nw);
    ['pw-current','pw-new','pw-confirm'].forEach(id => { document.getElementById(id).value = ''; });
    showToast('密碼已更新！');
  }

  /* ── Google Sheets 串接 ── */
  function loadScriptUrlField() {
    const url = localStorage.getItem(SCRIPT_URL_KEY) || DEFAULT_SCRIPT_URL;
    document.getElementById('script-url').value = url;
    updateSyncStatus();
  }
  function saveScriptUrl() {
    const url = document.getElementById('script-url').value.trim();
    localStorage.setItem(SCRIPT_URL_KEY, url);
    showToast('網址已儲存！');
    updateSyncStatus();
  }
  function updateSyncStatus() {
    const ts = parseInt(localStorage.getItem(LAST_SYNC_KEY) || '0');
    const el = document.getElementById('sync-status');
    if (!ts) { el.textContent = '尚未同步過'; return; }
    const d = new Date(ts);
    el.textContent = '上次同步：' + d.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
  }
  async function manualSync() {
    const url = localStorage.getItem(SCRIPT_URL_KEY) || '';
    if (!url) { alert('請先填入 Apps Script 網址！'); return; }
    const btn = document.getElementById('btn-sync');
    const status = document.getElementById('sync-status');
    btn.disabled = true;
    btn.textContent = '同步中…';
    status.textContent = '';
    try {
      const res  = await fetch(url);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      if (json.sorting && json.sorting.length) {
        localStorage.setItem(KEYS.sorting, JSON.stringify(json.sorting));
        data.sorting = json.sorting;
        renderSorting();
      }
      localStorage.setItem(LAST_SYNC_KEY, Date.now().toString());
      showToast('✓ 同步成功！');
      updateSyncStatus();
    } catch (err) {
      alert('同步失敗：' + err.message + '\n請確認網址是否正確，以及 Apps Script 是否已部署。');
    } finally {
      btn.disabled = false;
      btn.textContent = '🔄 立即同步';
    }
  }

  /* ── 工具 ── */
  function showScreen(name) {
    document.querySelectorAll('[id^=screen-]').forEach(s => s.classList.add('hidden'));
    document.getElementById(`screen-${name}`).classList.remove('hidden');
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.add('hidden'), 2500);
  }

  /* ── 初始化 ── */
  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  </script>

</body>
</html>
