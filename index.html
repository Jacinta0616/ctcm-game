<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>環保小遊戲 | 中台禪寺女眾環保組</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 背景裝飾 -->
  <div class="bg-deco" aria-hidden="true">
    <span class="leaf" style="top:8%;left:4%;font-size:1.8rem;animation-delay:0s">🌿</span>
    <span class="leaf" style="top:18%;right:6%;font-size:2.2rem;animation-delay:1.5s">🍃</span>
    <span class="leaf" style="top:55%;left:2%;font-size:1.4rem;animation-delay:3s">🌱</span>
    <span class="leaf" style="bottom:28%;right:4%;font-size:2rem;animation-delay:2s">🍀</span>
    <span class="leaf" style="bottom:12%;left:8%;font-size:1.6rem;animation-delay:4s">🌿</span>
    <span class="leaf" style="top:72%;right:10%;font-size:1.3rem;animation-delay:0.8s">🍃</span>
  </div>

  <div class="container">

    <!-- 標題區 -->
    <header class="header">
      <div class="mascot" aria-hidden="true">
        <span class="mascot-emoji">🌱</span>
        <span class="mascot-emoji mascot-right">♻️</span>
      </div>
      <h1 class="title">環保小遊戲</h1>
      <p class="subtitle">中台禪寺女眾環保組</p>
    </header>

    <!-- 出題方式選擇 -->
    <main>
      <h2 class="section-title">選擇出題方式</h2>
      <div class="games-grid" style="max-width:700px;margin:0 auto">

        <!-- 模式 1：合併出題 -->
        <a href="games/quiz/index.html" class="game-card card-mixed">
          <div class="card-icon">🎲</div>
          <div class="card-body">
            <h3>合併出題</h3>
            <p>架房清潔、資源回收、生物防治<br>三大主題混合出題，一次挑戰全部</p>
          </div>
          <span class="btn-play">開始挑戰 →</span>
        </a>

        <!-- 模式 2：選主題出題 -->
        <a href="theme-select.html" class="game-card card-theme">
          <div class="card-icon">🗂️</div>
          <div class="card-body">
            <h3>選主題出題</h3>
            <p>自己選一個主題<br>專心練習該主題的遊戲</p>
          </div>
          <span class="btn-play">選擇主題 →</span>
        </a>

      </div>
    </main>

  </div>

  <!-- 後台入口（低調放在角落） -->
  <a href="admin/index.html" class="btn-admin">⚙️ 後台管理</a>

  <script src="js/app.js"></script>
</body>
</html>
